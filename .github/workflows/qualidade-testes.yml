name: Validar otimização do painel de Qualidade

on:
  push:
    branches:
      - perf/qualidade-api-consultas-20261113
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q database.py main.py indicador_5cd.py indicador_csat.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
