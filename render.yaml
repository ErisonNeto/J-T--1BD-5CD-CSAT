services:
  - type: web
    name: jt-qualidade-1bd-5cd-csat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.10'
      - key: JT_STORAGE_MODE
        value: api
      - key: JT_API_CACHE_SECONDS
        value: '300'
      - key: JT_API_PAGE_SIZE
        value: '2000'
      - key: META_1BD
        value: '0.80'
      - key: REQUIRE_DASH_AUTH
        value: 'false'
      - key: REQUIRE_REMOTE_DB
        value: 'true'
      - key: JT_API_URL
        sync: false
      - key: JT_API_KEY
        sync: false
