services:
  - type: web
    name: jt-qualidade-1bd-5cd-csat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: META_1BD
        value: "0.80"
      - key: REQUIRE_DASH_AUTH
        value: "true"
      - key: REQUIRE_REMOTE_DB
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DASH_USER
        sync: false
      - key: DASH_PASS
        sync: false
